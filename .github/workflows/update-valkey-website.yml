name: Update Valkey Website

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: "Version of the package to build"
        required: true
      release_owner:
        type: string
        description: "GitHub login that approved the production release"
        required: true
      bashbrew_json:
        type: string
        description: "Bashbrew output from docker automation"
        required: true
      try_valkey_uploaded:
        type: string
        description: "Whether try-valkey files were uploaded to S3"
        required: false
        default: 'false'

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?|unstable)$ ]]; then
            echo "Invalid version format. Expected format: x.y.z or 'unstable'"
            exit 1
          fi

      - name: Generate token
        id: generate-token
        if: github.repository_owner == 'valkey-io'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-io.github.io
          # Security: without explicit permission-* inputs the minted token
          # inherits the App's FULL installation grant. This workflow checks
          # out valkey-io.github.io, commits release page updates, pushes a
          # branch, and opens a PR via peter-evans/create-pull-request:
          # contents write covers the git fetch/push, pull-requests write
          # covers PR creation, and metadata read covers the repository API
          # lookups both actions perform. Nothing else is granted.
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.x'

      - name: Checkout automation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: valkey-release-automation
          persist-credentials: false

      - name: Checkout website repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey-io.github.io
          path: valkey-io.github.io
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}

      - name: Format version for filename
        id: format-version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_DASHED=${VERSION//./-}
          echo "version_dashed=$VERSION_DASHED" >> $GITHUB_OUTPUT

      - name: Update Website Release File
        id: update-website
        # bashbrew_json is a large caller-supplied JSON blob; it must reach
        # the script through env, never by expression interpolation.
        env:
          VERSION: ${{ inputs.version }}
          BASHBREW_JSON: ${{ inputs.bashbrew_json }}
          VERSION_DASHED: ${{ steps.format-version.outputs.version_dashed }}
        run: |
          python valkey-release-automation/scripts/automate_website_description.py \
            "$VERSION" \
            valkey-io.github.io/templates/valkey-website-template.md \
            "$BASHBREW_JSON" \
            valkey-io.github.io/content/download/releases

          cd valkey-io.github.io
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "content/download/releases/v${VERSION_DASHED}.md"

          if ! git diff --cached --quiet; then
            git commit -s -m "Updates downloads section for version $VERSION"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit for website update"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Try Valkey website
        id: update-try-valkey
        if: inputs.try_valkey_uploaded == 'true'
        working-directory: valkey-io.github.io
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > content/try-valkey/_index.md << EOF
          +++
          title = "Try Valkey"
          template = "valkey-try-me.html"
          [extra]
          state_file = "https://download.valkey.io/try-me-valkey/$VERSION/states/state.bin.gz"
          filesystem_base_url = "https://download.valkey.io/try-me-valkey/$VERSION/fs/alpine-rootfs-flat"
          filesystem_base_fs = "https://download.valkey.io/try-me-valkey/$VERSION/fs/alpine-fs.json"
          +++
          
          
          EOF
          
          git add content/try-valkey/_index.md

          if ! git diff --cached --quiet content/try-valkey/_index.md; then
            git commit -s -m "Update Try Valkey to version $VERSION"
            echo "has_try_valkey_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit for Try Valkey update."
            echo "has_try_valkey_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.update-website.outputs.has_changes == 'true' || steps.update-try-valkey.outputs.has_try_valkey_changes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: valkey-io.github.io
          branch: update-website-${{ inputs.version }}
          commit-message: "updated website for version ${{ inputs.version }}"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          signoff: true
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          title: "Update website for version ${{ inputs.version }}"
          body: |
            This pull request updates the valkey website for the new release ${{ inputs.version }}.
            
            Changes:
            ${{ steps.update-website.outputs.has_changes == 'true' && '- Updated downloads page with new release information' || '' }}
            ${{ steps.update-try-valkey.outputs.has_try_valkey_changes == 'true' && format('- Updated Try Valkey page to use version {0}', inputs.version) || '' }}

            This pull request is created automatically by the [Valkey-Release-Automation](https://github.com/valkey-io/valkey-release-automation)

      - name: Notify release owner
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          RELEASE_OWNER: ${{ inputs.release_owner }}
        run: gh pr comment "${{ steps.create-pr.outputs.pull-request-number }}" --repo "${{ github.repository_owner }}/valkey-io.github.io" --body "@$RELEASE_OWNER, please review this automated release PR."
