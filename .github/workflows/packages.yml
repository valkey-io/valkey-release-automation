name: Build Valkey Packages (RPM + DEB)
# publish defaults to false. The normal release caller may set
# release_gate_passed only after build-release's release-publish job succeeds.
# A direct dispatch cannot set that input and must pass the standalone gate.

on:
  workflow_call:
    inputs:
      version:
        description: 'Valkey version to build packages for (e.g., 9.0.3)'
        required: true
        type: string
      source_sha:
        description: 'Exact valkey commit to build from; empty uses the tag/branch archive'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish packages to S3/pages after tests pass'
        required: false
        type: boolean
        default: false
      release_gate_passed:
        description: Internal receipt from build-release's approved production job.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Valkey version to build packages for (e.g., 9.0.3)'
        required: true
        type: string
      source_sha:
        description: 'Exact valkey commit to build from; empty uses the tag/branch archive'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish packages to S3/pages after tests pass'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - '.github/package-platforms.json'
      - 'packaging/**'
      - 'scripts/build-rpm.sh'
      - 'scripts/build-deb.sh'
      - 'scripts/publish-to-s3.sh'
      - 'scripts/publish-repos.sh'
      - 'scripts/generate-from-templates.sh'
      - 'scripts/test_packages.sh'

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.version || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  standalone-approval:
    name: Standalone publish approval
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: read
    steps:
      - run: echo "Standalone package publication approved."

  ############################################################################
  # Process Inputs
  ############################################################################
  process-inputs:
    name: Process Inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      rpm_matrix: ${{ steps.matrix.outputs.rpm }}
      deb_matrix: ${{ steps.matrix.outputs.deb }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/package-platforms.json
            packaging/*/debian/changelog
          sparse-checkout-cone-mode: false

      - name: Validate versions and derive build list
        id: derive
        # inputs.version and the PR number are attacker-influenced; they enter
        # the script only through env, and the explicit version is validated
        # before any other use.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Validate the explicit version input FIRST, before any other use.
          if [ -n "$VERSION" ] && [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "ERROR: Invalid version format '${VERSION}'."
            echo "Expected: x.y.z or x.y.z-rcN (e.g., 9.0.3, 8.1.0-rc1)"
            exit 1
          fi

          # Resolve the newest release tag for a MAJOR.MINOR line from the
          # valkey repo, falling back to the committed changelog.
          resolve_line_version() {
            local line="$1" v=""
            v=$(gh api "repos/valkey-io/valkey/git/matching-refs/tags/${line}." --jq '.[].ref' 2>/dev/null \
              | sed 's|refs/tags/||' \
              | grep -E "^${line//./\\.}\.[0-9]+$" \
              | sort -V | tail -1) || true
            if [ -n "$v" ]; then
              echo "Resolved latest ${line}.x release tag: ${v}" >&2
            elif [ -f "packaging/${line}/debian/changelog" ]; then
              v=$(head -1 "packaging/${line}/debian/changelog" | sed 's/.*(\([^)]*\)).*/\1/' | sed 's/-.*//')
              echo "Tag lookup failed for ${line}: detected ${v} from packaging/${line}/debian/changelog" >&2
            fi
            echo "$v"
          }

          VERSIONS=""
          if [ -n "$VERSION" ]; then
            # Explicit version input (release dispatch / workflow_call)
            VERSIONS="$VERSION"
          else
            # pull_request trigger: build every packaging line the PR modifies,
            # falling back to the latest packaging line when none are touched.
            CHANGED_LINES=""
            if [ "$EVENT_NAME" = "pull_request" ]; then
              CHANGED_LINES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                --paginate --jq '.[].filename' \
                | sed -n 's|^packaging/\([0-9][0-9]*\.[0-9][0-9]*\)/.*|\1|p' | sort -Vu)
              if [ -n "$CHANGED_LINES" ]; then
                echo "PR modifies packaging line(s): $(echo $CHANGED_LINES | tr '\n' ' ')"
              fi
            fi
            if [ -z "$CHANGED_LINES" ]; then
              CHANGED_LINES=$(ls -d packaging/[0-9]*/ 2>/dev/null | sort -V | tail -1 | sed 's|packaging/||; s|/||')
            fi
            for LINE in $CHANGED_LINES; do
              V=$(resolve_line_version "$LINE")
              if [ -n "$V" ]; then
                VERSIONS="${VERSIONS}${VERSIONS:+ }${V}"
              else
                echo "WARNING: could not resolve a version for packaging line ${LINE}, skipping"
              fi
            done
            if [ -z "$VERSIONS" ]; then
              VERSIONS="8.1.1"
              echo "No version resolved from any source: using fallback ${VERSIONS}"
            fi
          fi

          # Validate semver format: x.y.z or x.y.z-rcN
          for V in $VERSIONS; do
            if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
              echo "ERROR: Invalid version format '${V}'."
              echo "Expected: x.y.z or x.y.z-rcN (e.g., 9.0.3, 8.1.0-rc1)"
              exit 1
            fi
          done

          # versions: JSON array consumed as a matrix axis by build/test jobs.
          # version: first (primary) version, kept for publish/summary steps
          # which only run on single-version release builds.
          VERSIONS_JSON=$(printf '%s\n' $VERSIONS | jq -R . | jq -cs .)
          PRIMARY="${VERSIONS%% *}"

          echo "versions=${VERSIONS_JSON}" >> "$GITHUB_OUTPUT"
          echo "version=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "Versions: ${VERSIONS_JSON}"
          echo "Primary version: ${PRIMARY}"

      - name: Generate platform matrices
        id: matrix
        env:
          VERSIONS_JSON: ${{ steps.derive.outputs.versions }}
        run: |
          CONFIG=".github/package-platforms.json"
          echo "rpm=$(jq -c --argjson vs "$VERSIONS_JSON" '.rpm + {version: $vs}' "$CONFIG")" >> "$GITHUB_OUTPUT"
          echo "deb=$(jq -c --argjson vs "$VERSIONS_JSON" '.deb + {version: $vs}' "$CONFIG")" >> "$GITHUB_OUTPUT"

  ############################################################################
  # RPM Builds
  ############################################################################
  build-rpm:
    name: RPM · ${{ matrix.platform.name }} (${{ matrix.arch }}) · v${{ matrix.version }}
    needs: process-inputs
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.process-inputs.outputs.rpm_matrix) }}

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Fetch source at exact commit
        if: inputs.source_sha != ''
        env:
          SHA: ${{ inputs.source_sha }}
          VERSION: ${{ matrix.version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full 40-char SHA"; exit 1; }
          mkdir -p source /tmp/repack
          wget -q "https://github.com/${REPO_OWNER}/valkey/archive/${SHA}.tar.gz" -O /tmp/src.tar.gz
          tar xzf /tmp/src.tar.gz -C /tmp/repack
          mv "/tmp/repack/valkey-${SHA}" "/tmp/repack/valkey-${VERSION}"
          tar czf source/valkey-src.tar.gz -C /tmp/repack "valkey-${VERSION}"
          rm -rf /tmp/repack /tmp/src.tar.gz

      - name: Build RPM in container
        env:
          ARCH: ${{ matrix.arch }}
          VALKEY_VERSION: ${{ matrix.version }}
          PLATFORM_FAMILY: ${{ matrix.platform.family }}
          PLATFORM_ID: ${{ matrix.platform.id }}
          EPEL_PACKAGE: ${{ matrix.platform.epel }}
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          # Security: the moving-branch fallback in build-rpm.sh is opt-in
          # and reserved for the pull_request (dev) path, where packaging
          # changes may target a version whose tag is not cut yet. Release
          # paths never set it, so a failed tag download fails the build
          # instead of silently repackaging branch HEAD as the release.
          ALLOW_BRANCH_FALLBACK: ${{ github.event_name == 'pull_request' && 'true' || '' }}
        run: |
          if [ "$ARCH" = "aarch64" ]; then
            DOCKER_PLATFORM="linux/arm64"
          else
            DOCKER_PLATFORM="linux/amd64"
          fi
          PACKAGING_DIR="${VALKEY_VERSION%%-*}"
          PACKAGING_DIR="${PACKAGING_DIR%.*}"
          VALKEY_SOURCE_TARBALL=""
          if [ -n "$SOURCE_SHA" ]; then
            VALKEY_SOURCE_TARBALL="/source/valkey-src.tar.gz"
          fi

          docker run --rm \
            --platform="$DOCKER_PLATFORM" \
            -e PLATFORM_FAMILY="$PLATFORM_FAMILY" \
            -e PLATFORM_ID="$PLATFORM_ID" \
            -e EPEL_PACKAGE="$EPEL_PACKAGE" \
            -e VALKEY_VERSION="${VALKEY_VERSION}" \
            -e EXPECTED_ARCH="$ARCH" \
            -e ALLOW_BRANCH_FALLBACK="$ALLOW_BRANCH_FALLBACK" \
            -v "${GITHUB_WORKSPACE}/scripts:/scripts:ro" \
            -v "${GITHUB_WORKSPACE}/packaging/common/rpm:/packaging-common:ro" \
            -v "${GITHUB_WORKSPACE}/packaging/${PACKAGING_DIR}/rpm:/packaging-override:ro" \
            -v "${GITHUB_WORKSPACE}/packaging/templates/rpm:/packaging-templates:ro" \
            -v "$(pwd)/output:/output" \
            -v "${GITHUB_WORKSPACE}/source:/source:ro" \
            -e VALKEY_SOURCE_TARBALL="$VALKEY_SOURCE_TARBALL" \
            "$CONTAINER_IMAGE" \
            bash /scripts/build-rpm.sh

      - name: List built packages
        run: |
          echo "Built packages:"
          ls -lh output/

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: valkey-rpms-${{ matrix.platform.id }}-${{ matrix.arch }}${{ github.event_name == 'pull_request' && format('-v{0}', matrix.version) || '' }}
          path: output/*.rpm
          retention-days: 30

  ############################################################################
  # DEB Builds
  ############################################################################
  build-deb:
    name: DEB · ${{ matrix.platform.name }} (${{ matrix.arch }}) · v${{ matrix.version }}
    needs: process-inputs
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.process-inputs.outputs.deb_matrix) }}

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up QEMU for cross-platform builds
        if: matrix.arch == 'arm64' && runner.os == 'Linux' && runner.arch == 'X64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Fetch source at exact commit
        if: inputs.source_sha != ''
        env:
          SHA: ${{ inputs.source_sha }}
          VERSION: ${{ matrix.version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full 40-char SHA"; exit 1; }
          mkdir -p source /tmp/repack
          wget -q "https://github.com/${REPO_OWNER}/valkey/archive/${SHA}.tar.gz" -O /tmp/src.tar.gz
          tar xzf /tmp/src.tar.gz -C /tmp/repack
          mv "/tmp/repack/valkey-${SHA}" "/tmp/repack/valkey-${VERSION}"
          tar czf source/valkey-src.tar.gz -C /tmp/repack "valkey-${VERSION}"
          rm -rf /tmp/repack /tmp/src.tar.gz

      - name: Build DEB in container
        env:
          ARCH: ${{ matrix.arch }}
          VALKEY_VERSION: ${{ matrix.version }}
          PLATFORM_ID: ${{ matrix.platform.id }}
          PLATFORM_CODENAME: ${{ matrix.platform.codename }}
          APT_SNAPSHOT: ${{ matrix.platform.apt_snapshot || '' }}
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          # Security: the moving-branch fallback in build-deb.sh is opt-in
          # and reserved for the pull_request (dev) path, where packaging
          # changes may target a version whose tag is not cut yet. Release
          # paths never set it, so a failed tag download fails the build
          # instead of silently repackaging branch HEAD as the release.
          ALLOW_BRANCH_FALLBACK: ${{ github.event_name == 'pull_request' && 'true' || '' }}
        run: |
          DOCKER_PLATFORM="linux/${ARCH}"
          PACKAGING_DIR="${VALKEY_VERSION%%-*}"
          PACKAGING_DIR="${PACKAGING_DIR%.*}"
          VALKEY_SOURCE_TARBALL=""
          if [ -n "$SOURCE_SHA" ]; then
            VALKEY_SOURCE_TARBALL="/source/valkey-src.tar.gz"
          fi

          docker run --rm \
            --platform="$DOCKER_PLATFORM" \
            -e PLATFORM_ID="$PLATFORM_ID" \
            -e PLATFORM_CODENAME="$PLATFORM_CODENAME" \
            -e APT_SNAPSHOT="$APT_SNAPSHOT" \
            -e VALKEY_VERSION="${VALKEY_VERSION}" \
            -e EXPECTED_ARCH="$ARCH" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ALLOW_BRANCH_FALLBACK="$ALLOW_BRANCH_FALLBACK" \
            -v "${GITHUB_WORKSPACE}/scripts:/scripts:ro" \
            -v "${GITHUB_WORKSPACE}/packaging/common/debian:/packaging-common:ro" \
            -v "${GITHUB_WORKSPACE}/packaging/${PACKAGING_DIR}/debian:/packaging-override:ro" \
            -v "${GITHUB_WORKSPACE}/packaging/templates/debian:/packaging-templates:ro" \
            -v "$(pwd)/output:/output" \
            -v "${GITHUB_WORKSPACE}/source:/source:ro" \
            -e VALKEY_SOURCE_TARBALL="$VALKEY_SOURCE_TARBALL" \
            "$CONTAINER_IMAGE" \
            bash /scripts/build-deb.sh

      - name: List built packages
        run: |
          echo "Built packages:"
          ls -lh output/
          echo ""
          echo "Package details:"
          for deb in output/*.deb; do
            if [ -f "$deb" ]; then
              echo "---"
              echo "File: $(basename $deb)"
              dpkg-deb --info "$deb" | grep -E "Package|Version|Architecture" || true
            fi
          done

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: valkey-debs-${{ matrix.platform.id }}-${{ matrix.arch }}${{ github.event_name == 'pull_request' && format('-v{0}', matrix.version) || '' }}
          path: |
            output/*.deb
            output/*.ddeb
            output/*.buildinfo
            output/*.changes
          retention-days: 30

  ############################################################################
  # RPM Package Tests (all platforms)
  ############################################################################
  test-rpm:
    name: Test RPM · ${{ matrix.platform.name }} (${{ matrix.arch }}) · v${{ matrix.version }}
    needs: [process-inputs, build-rpm]
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.process-inputs.outputs.rpm_matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Download RPM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: valkey-rpms-${{ matrix.platform.id }}-${{ matrix.arch }}${{ github.event_name == 'pull_request' && format('-v{0}', matrix.version) || '' }}
          path: packages

      - name: List downloaded packages
        env:
          PLATFORM_NAME: ${{ matrix.platform.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "Downloaded packages for ${PLATFORM_NAME} (${ARCH}):"
          ls -lh packages/

      - name: Run package tests in Docker
        env:
          ARCH: ${{ matrix.arch }}
          VALKEY_VERSION: ${{ matrix.version }}
          PLATFORM_ID: ${{ matrix.platform.id }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          PLATFORM_FAMILY: ${{ matrix.platform.family }}
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
        run: |
          if [ "$ARCH" = "aarch64" ]; then
            DOCKER_PLATFORM="linux/arm64"
          else
            DOCKER_PLATFORM="linux/amd64"
          fi
          CONTAINER_NAME="test-rpm-${PLATFORM_ID}-${ARCH}"

          # Phase 1: Install systemd in a plain container.
          # Minimal container images don't ship /sbin/init, so start with
          # "sleep infinity", install systemd, commit, then recreate with /sbin/init.
          docker run -d \
            --name "${CONTAINER_NAME}-setup" \
            --platform="$DOCKER_PLATFORM" \
            "$CONTAINER_IMAGE" \
            sleep infinity

          echo "Installing systemd prerequisites..."
          if [ "$PLATFORM_FAMILY" = "suse" ]; then
            docker exec "${CONTAINER_NAME}-setup" bash -c \
              'zypper -n install -y systemd systemd-sysvinit procps iproute2 2>/dev/null'
          else
            docker exec "${CONTAINER_NAME}-setup" bash -c '
              if command -v dnf5 &>/dev/null; then
                dnf5 install -y systemd procps-ng iproute
              elif command -v dnf &>/dev/null; then
                dnf install -y systemd procps-ng iproute
              else
                yum install -y systemd procps-ng iproute
              fi
              # Mask makecache timers before systemd starts to prevent
              # background cache operations from holding package manager locks
              mkdir -p /etc/systemd/system
              ln -sf /dev/null /etc/systemd/system/dnf-makecache.timer 2>/dev/null || true
              ln -sf /dev/null /etc/systemd/system/dnf-makecache.service 2>/dev/null || true
              ln -sf /dev/null /etc/systemd/system/dnf5-makecache.timer 2>/dev/null || true
              ln -sf /dev/null /etc/systemd/system/dnf5-makecache.service 2>/dev/null || true
            '
          fi

          # Ensure /sbin/init exists - some distros don't create it automatically
          docker exec "${CONTAINER_NAME}-setup" bash -c '
            if [ ! -e /sbin/init ]; then
              ln -sf /usr/lib/systemd/systemd /sbin/init
            fi
          '

          docker commit "${CONTAINER_NAME}-setup" "${CONTAINER_NAME}-img"
          docker rm -f "${CONTAINER_NAME}-setup" >/dev/null 2>&1

          # Phase 2: Start a new container from the committed image with /sbin/init.
          # --privileged is needed for systemd service hardening features
          # (PrivateTmp, ProtectHome, etc.) which require mount namespacing.
          docker create \
            --name "$CONTAINER_NAME" \
            --privileged \
            --platform="$DOCKER_PLATFORM" \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            "${CONTAINER_NAME}-img" \
            /sbin/init

          docker start "$CONTAINER_NAME"

          echo "Waiting for systemd to initialize..."
          for i in $(seq 1 60); do
            if docker exec "$CONTAINER_NAME" systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
              echo "systemd is ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "WARNING: systemd did not reach running state within 60 seconds"
              docker exec "$CONTAINER_NAME" systemctl is-system-running 2>/dev/null || true
              docker logs "$CONTAINER_NAME" 2>&1 | tail -20
            fi
            sleep 1
          done

          docker cp packages/. "$CONTAINER_NAME":/packages/
          docker cp scripts/test_packages.sh "$CONTAINER_NAME":/test_packages.sh

          echo ""
          echo "============================================="
          echo "Running tests on ${PLATFORM_NAME} (${ARCH})"
          echo "Valkey version: $VALKEY_VERSION"
          echo "============================================="
          echo ""

          # Under the runner's default `bash -e`, a test failure fails the
          # step here; ephemeral runners make container cleanup unnecessary.
          docker exec "$CONTAINER_NAME" bash /test_packages.sh \
            --pkg-dir=/packages \
            --version="$VALKEY_VERSION"

  ############################################################################
  # DEB Package Tests (all platforms)
  ############################################################################
  test-deb:
    name: Test DEB · ${{ matrix.platform.name }} (${{ matrix.arch }}) · v${{ matrix.version }}
    needs: [process-inputs, build-deb]
    permissions:
      contents: read
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.process-inputs.outputs.deb_matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Download DEB artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: valkey-debs-${{ matrix.platform.id }}-${{ matrix.arch }}${{ github.event_name == 'pull_request' && format('-v{0}', matrix.version) || '' }}
          path: packages

      - name: List downloaded packages
        env:
          PLATFORM_NAME: ${{ matrix.platform.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "Downloaded packages for ${PLATFORM_NAME} (${ARCH}):"
          ls -lh packages/

      - name: Run package tests in Docker
        env:
          ARCH: ${{ matrix.arch }}
          VALKEY_VERSION: ${{ matrix.version }}
          PLATFORM_ID: ${{ matrix.platform.id }}
          PLATFORM_NAME: ${{ matrix.platform.name }}
          CONTAINER_IMAGE: ${{ matrix.platform.container }}
        run: |
          DOCKER_PLATFORM="linux/${ARCH}"
          CONTAINER_NAME="test-deb-${PLATFORM_ID}-${ARCH}"

          # Phase 1: Install systemd prerequisites in a plain container.
          # Debian/Ubuntu minimal images don't ship /sbin/init, so we start
          # with "sleep infinity" first, install systemd, then recreate with /sbin/init.
          docker run -d \
            --name "${CONTAINER_NAME}-setup" \
            --platform="$DOCKER_PLATFORM" \
            "$CONTAINER_IMAGE" \
            sleep infinity

          echo "Installing systemd prerequisites..."
          docker exec \
            -e APT_SNAPSHOT="${{ matrix.platform.apt_snapshot || '' }}" \
            -e PLATFORM_CODENAME="${{ matrix.platform.codename }}" \
            "${CONTAINER_NAME}-setup" bash -c '
            set -e
            # Debian 11 reached the end of LTS on 2026-08-31. Its live mirrors
            # can no longer provide a coherent, durable package set, so EOL
            # platforms opt into an immutable Debian snapshot through
            # package-platforms.json, matching build-deb.sh.
            if [ -n "${APT_SNAPSHOT:-}" ]; then
              if [[ ! "$APT_SNAPSHOT" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
                echo "ERROR: invalid Debian snapshot timestamp: $APT_SNAPSHOT"
                exit 1
              fi
              {
                echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/${APT_SNAPSHOT}/ ${PLATFORM_CODENAME} main"
                echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/${APT_SNAPSHOT}/ ${PLATFORM_CODENAME}-updates main"
                echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/${APT_SNAPSHOT}/ ${PLATFORM_CODENAME}-security main"
              } > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*
            fi
            # set -e makes an apt failure fail this step immediately instead of
            # committing a systemd-less image that only breaks at /sbin/init.
            apt-get update && apt-get install -y systemd systemd-sysv procps iproute2
            # Mask units that interfere with container operation
            mkdir -p /etc/systemd/system
            ln -sf /dev/null /etc/systemd/system/apt-daily.timer 2>/dev/null || true
            ln -sf /dev/null /etc/systemd/system/apt-daily-upgrade.timer 2>/dev/null || true
          '

          docker commit "${CONTAINER_NAME}-setup" "${CONTAINER_NAME}-img"
          docker rm -f "${CONTAINER_NAME}-setup" >/dev/null 2>&1

          # Phase 2: Start a new container from the committed image with /sbin/init.
          # --privileged is required for systemd v257+ (Debian 13+) which enforces
          # stricter cgroup and security constraints.
          docker create \
            --name "$CONTAINER_NAME" \
            --privileged \
            --platform="$DOCKER_PLATFORM" \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            "${CONTAINER_NAME}-img" \
            /sbin/init

          docker start "$CONTAINER_NAME"

          echo "Waiting for systemd to initialize..."
          for i in $(seq 1 60); do
            if docker exec "$CONTAINER_NAME" systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
              echo "systemd is ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "WARNING: systemd did not reach running state within 60 seconds"
              docker exec "$CONTAINER_NAME" systemctl is-system-running 2>/dev/null || true
              docker logs "$CONTAINER_NAME" 2>&1 | tail -20
            fi
            sleep 1
          done

          docker cp packages/. "$CONTAINER_NAME":/packages/
          docker cp scripts/test_packages.sh "$CONTAINER_NAME":/test_packages.sh

          echo ""
          echo "============================================="
          echo "Running tests on ${PLATFORM_NAME} (${ARCH})"
          echo "Valkey version: $VALKEY_VERSION"
          echo "============================================="
          echo ""

          # Under the runner's default `bash -e`, a test failure fails the
          # step here; ephemeral runners make container cleanup unnecessary.
          docker exec "$CONTAINER_NAME" bash /test_packages.sh \
            --pkg-dir=/packages \
            --version="$VALKEY_VERSION"

  ############################################################################
  # Publish Packages to S3
  ############################################################################
  publish-to-s3:
    name: Publish to S3
    needs: [standalone-approval, process-inputs, build-rpm, build-deb, test-rpm, test-deb]
    runs-on: ubuntu-latest
    # Called release: build-release already proved its environment approval.
    # Direct dispatch: standalone-approval proves it here. Qualification has
    # publish=false and cannot reach either branch.
    if: >-
      ${{ !failure() && !cancelled() && inputs.publish == true &&
          ((inputs.release_gate_passed == true && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' && needs.standalone-approval.result == 'success')) }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Install repository tools
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c dpkg-dev debsigs gpg rpm
          pip install awscli

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.S3_REGION }}

      - name: Sign packages and upload to S3
        env:
          VERSION: ${{ needs.process-inputs.outputs.version }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          bash scripts/publish-to-s3.sh \
            "$VERSION" \
            "$GPG_FINGERPRINT" \
            artifacts \
            "$S3_BUCKET" \
            "$S3_REGION"

  ############################################################################
  # Deploy Install Instructions to GitHub Pages
  ############################################################################
  deploy-pages:
    name: Deploy Pages
    needs: [process-inputs, publish-to-s3]
    runs-on: ubuntu-latest
    if: ${{ success() && inputs.publish == true }}
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      # No gh-pages checkout: publish-repos.sh creates the site directory and
      # only writes new files, and keep_files below preserves everything
      # already on the branch.
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install AWS CLI
        run: pip install awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.S3_REGION }}

      - name: Generate site
        env:
          VERSION: ${{ needs.process-inputs.outputs.version }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          REPO_URL="https://download.valkey.io/packaging"
          bash scripts/publish-repos.sh \
            "$VERSION" \
            "$GPG_FINGERPRINT" \
            "${REPO_URL}" \
            "${PAGES_URL}" \
            "$S3_BUCKET" \
            "$S3_REGION" \
            site \
            scripts/pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true

  ############################################################################
  # Combined Summary
  ############################################################################
  build-summary:
    name: Build Summary
    needs: [process-inputs, build-rpm, build-deb, test-rpm, test-deb, publish-to-s3, deploy-pages]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build and test results
        env:
          RPM_RESULT: ${{ needs.build-rpm.result }}
          DEB_RESULT: ${{ needs.build-deb.result }}
          RPM_TEST_RESULT: ${{ needs.test-rpm.result }}
          DEB_TEST_RESULT: ${{ needs.test-deb.result }}
          S3_RESULT: ${{ needs.publish-to-s3.result }}
          PAGES_RESULT: ${{ needs.deploy-pages.result }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$RPM_RESULT" = "success" ]; then
            echo "- :white_check_mark: All RPM builds completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Some RPM builds failed (status: $RPM_RESULT)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$DEB_RESULT" = "success" ]; then
            echo "- :white_check_mark: All DEB builds completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Some DEB builds failed (status: $DEB_RESULT)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$RPM_TEST_RESULT" = "success" ]; then
            echo "- :white_check_mark: All RPM package tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$RPM_TEST_RESULT" = "skipped" ]; then
            echo "- :warning: RPM package tests were skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Some RPM package tests failed (status: $RPM_TEST_RESULT)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$DEB_TEST_RESULT" = "success" ]; then
            echo "- :white_check_mark: All DEB package tests passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$DEB_TEST_RESULT" = "skipped" ]; then
            echo "- :warning: DEB package tests were skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Some DEB package tests failed (status: $DEB_TEST_RESULT)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$S3_RESULT" = "success" ]; then
            echo "- :white_check_mark: Packages published to S3" >> $GITHUB_STEP_SUMMARY
          elif [ "$S3_RESULT" = "skipped" ]; then
            echo "- :warning: S3 publishing was skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: S3 publishing failed (status: $S3_RESULT)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PAGES_RESULT" = "success" ]; then
            echo "- :white_check_mark: Install instructions deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          elif [ "$PAGES_RESULT" = "skipped" ]; then
            echo "- :warning: Pages deployment was skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Pages deployment failed (status: $PAGES_RESULT)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=false
          for result in "$RPM_RESULT" "$DEB_RESULT" "$RPM_TEST_RESULT" "$DEB_TEST_RESULT" "$S3_RESULT" "$PAGES_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi

      - name: Download all artifacts
        if: success()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-packages

      - name: Generate artifact summary
        if: success()
        env:
          VERSION: ${{ needs.process-inputs.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "## Built RPM Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Version | Packages | Total Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|---------|----------|------------|" >> $GITHUB_STEP_SUMMARY

          for dir in all-packages/valkey-rpms-*/; do
            if [ -d "$dir" ]; then
              artifact=$(basename "$dir" | sed 's/valkey-rpms-//')
              version=$(echo "$artifact" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' | sed 's/^v//')
              rest=$(echo "$artifact" | sed -E 's/-v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$//')
              arch=$(echo "$rest" | rev | cut -d'-' -f1 | rev)
              platform=$(echo "$rest" | rev | cut -d'-' -f2- | rev)
              count=$(find "$dir" -name "*.rpm" -type f | wc -l)
              size=$(du -sh "$dir" | cut -f1)
              echo "| $platform | $arch | ${version:-$VERSION} | $count | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Built DEB Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Version | Packages | Total Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|---------|----------|------------|" >> $GITHUB_STEP_SUMMARY

          for dir in all-packages/valkey-debs-*/; do
            if [ -d "$dir" ]; then
              artifact=$(basename "$dir" | sed 's/valkey-debs-//')
              version=$(echo "$artifact" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' | sed 's/^v//')
              rest=$(echo "$artifact" | sed -E 's/-v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$//')
              arch=$(echo "$rest" | rev | cut -d'-' -f1 | rev)
              platform=$(echo "$rest" | rev | cut -d'-' -f2- | rev)
              count=$(find "$dir" -name "*.deb" -type f | wc -l)
              size=$(du -sh "$dir" | cut -f1)
              echo "| $platform | $arch | ${version:-$VERSION} | $count | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are available for download in the Actions tab." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          REPO_URL="https://download.valkey.io/packaging"
          echo ":package: **Package repository (S3):** ${REPO_URL}" >> $GITHUB_STEP_SUMMARY
          echo ":globe_with_meridians: **Install instructions:** [${PAGES_URL}](${PAGES_URL})" >> $GITHUB_STEP_SUMMARY
