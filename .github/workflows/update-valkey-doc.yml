name: Update Valkey Documentation

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: "Version of the release"
        required: true
      release_owner:
        type: string
        description: "GitHub login that approved the production release"
        required: true

jobs:
  update-valkey-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Check release type
        id: check-release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PATCH=$(echo "$VERSION" | cut -d. -f3 | sed 's/-rc[0-9]*//')
          MINOR_VERSION=$(echo "$VERSION" | cut -d. -f1,2)
          
          if [[ "$VERSION" == *"-rc"* ]]; then
            echo "is_major_minor=false" >> $GITHUB_OUTPUT
            echo "is_patch=false" >> $GITHUB_OUTPUT
          elif [[ "$PATCH" != "0" ]]; then
            echo "is_major_minor=false" >> $GITHUB_OUTPUT
            echo "is_patch=true" >> $GITHUB_OUTPUT
            PREV_PATCH=$((PATCH - 1))
            echo "previous_patch_version=${MINOR_VERSION}.${PREV_PATCH}" >> $GITHUB_OUTPUT
          else
            echo "is_major_minor=true" >> $GITHUB_OUTPUT
            echo "is_patch=false" >> $GITHUB_OUTPUT
          fi
          
          echo "minor_version=$MINOR_VERSION" >> $GITHUB_OUTPUT

      - name: Generate token
        if: (steps.check-release.outputs.is_major_minor == 'true' || steps.check-release.outputs.is_patch == 'true') && github.repository_owner == 'valkey-io'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-doc
          # Security: without explicit permission-* inputs the minted token
          # inherits the App's FULL installation grant. This workflow checks
          # out valkey-doc, pushes a release tag (patch path), and pushes a
          # branch plus opens a PR via peter-evans/create-pull-request
          # (major/minor path): contents write covers the git fetch, tag
          # push, and branch push, pull-requests write covers PR creation,
          # and metadata read covers the repository API lookups both actions
          # perform. Nothing else is granted.
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Checkout valkey-doc for patch
        if: steps.check-release.outputs.is_patch == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey-doc
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: valkey-doc
          # Full history: fetch-tags with the default shallow depth only follows
          # tags reachable from the default branch tip, so older-line tags
          # (e.g. 8.1.x when main is at 9.x) would be missing.
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag in valkey-doc
        if: steps.check-release.outputs.is_patch == 'true'
        working-directory: valkey-doc
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ steps.check-release.outputs.previous_patch_version }}
        run: |
          # Verify the previous tag exists
          if ! git rev-parse "refs/tags/${PREVIOUS}" >/dev/null 2>&1; then
            echo "::error::Previous tag '${PREVIOUS}' does not exist in valkey-doc. Cannot create tag '${VERSION}'."
            exit 1
          fi

          # Peel to the commit: previous tags may be annotated, and tagging the
          # tag object would not put the new tag directly on the same commit.
          EXPECTED=$(git rev-parse "${PREVIOUS}^{commit}")

          # If the tag already exists remotely, verify it points at the expected
          # commit (peeled ^{} line for annotated tags, plain line for lightweight).
          REMOTE=$(git ls-remote origin "refs/tags/${VERSION}" "refs/tags/${VERSION}^{}")
          if [[ -n "$REMOTE" ]]; then
            EXISTING=$(echo "$REMOTE" | awk -v ref="refs/tags/${VERSION}^{}" '$2 == ref {print $1}')
            if [[ -z "$EXISTING" ]]; then
              EXISTING=$(echo "$REMOTE" | awk -v ref="refs/tags/${VERSION}" '$2 == ref {print $1}')
            fi
            if [[ "$EXISTING" == "$EXPECTED" ]]; then
              echo "Tag '${VERSION}' already exists at expected commit ${EXPECTED}. Nothing to do."
              exit 0
            fi
            echo "::error::Tag '${VERSION}' already exists but points at ${EXISTING}, expected ${EXPECTED} (commit of '${PREVIOUS}')."
            exit 1
          fi

          # Create lightweight tag pointing at the same commit as the previous tag
          git tag "${VERSION}" "${EXPECTED}"
          git push origin "refs/tags/${VERSION}"
          echo "Successfully created and pushed tag '${VERSION}' pointing at ${EXPECTED} (commit of '${PREVIOUS}')."

      - name: Checkout valkey
        if: steps.check-release.outputs.is_major_minor == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey
          ref: ${{ inputs.version }}
          path: valkey
          # Fetch full history and all tags. generate-module-api-doc.rb derives
          # each module API's "Available since" version by scanning all tags for
          # the earliest one containing the function. A shallow checkout leaves
          # only the release tag visible, so every pre-existing function is
          # wrongly stamped with the current release version.
          fetch-depth: 0

      - name: Checkout valkey-doc
        if: steps.check-release.outputs.is_major_minor == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey-doc
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: valkey-doc

      - name: Setup Ruby
        if: steps.check-release.outputs.is_major_minor == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.0'

      - name: Generate module API docs
        if: steps.check-release.outputs.is_major_minor == 'true'
        working-directory: valkey
        run: ./utils/generate-module-api-doc.rb > ../valkey-doc/topics/modules-api-ref.md

      - name: Update supported versions
        if: steps.check-release.outputs.is_major_minor == 'true'
        working-directory: valkey-doc
        env:
          MINOR_VERSION: ${{ steps.check-release.outputs.minor_version }}
        run: |
          MINOR_NUM=$(echo "$MINOR_VERSION" | cut -d. -f2)
          
          TODAY=$(date +%Y-%m-%d)
          MAINTENANCE_END=$(date -d "+3 years" +%Y-%m-%d)
          
          if [[ "$MINOR_NUM" == "0" ]]; then
            SECURITY_END="$MAINTENANCE_END"
          else
            SECURITY_END=$(date -d "+5 years" +%Y-%m-%d)
          fi
          
          NEW_ROW="| $MINOR_VERSION | $TODAY | $MAINTENANCE_END | $SECURITY_END |"
          
          sed -i "/| -- | -- | -- | -- |/a $NEW_ROW" topics/releases.md

      - name: Update Makefile
        if: steps.check-release.outputs.is_major_minor == 'true'
        working-directory: valkey-doc
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DATE=$(date +%Y-%m-%d)
          
          sed -i "s/^VERSION ?= .*/VERSION ?= $VERSION/" Makefile
          sed -i "s/^DATE ?= .*/DATE ?= $DATE/" Makefile

      - name: Update valkey.conf.md
        if: steps.check-release.outputs.is_major_minor == 'true'
        working-directory: valkey-doc
        env:
          MINOR_VERSION: ${{ steps.check-release.outputs.minor_version }}
        run: |
          NEW_LINE="* The self documented [valkey.conf for Valkey $MINOR_VERSION](https://raw.githubusercontent.com/valkey-io/valkey/$MINOR_VERSION/valkey.conf)."
          
          LINE_NUM=$(grep -n "The self documented \[valkey.conf for Valkey" topics/valkey.conf.md | head -1 | cut -d: -f1)
          
          sed -i "${LINE_NUM}i\\${NEW_LINE}" topics/valkey.conf.md

      - name: Create Pull Request
        id: create-pr
        if: steps.check-release.outputs.is_major_minor == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: valkey-doc
          branch: update-docs-${{ inputs.version }}
          commit-message: "Update documentation for Valkey ${{ inputs.version }}"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          signoff: true
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          title: "Update documentation for Valkey ${{ inputs.version }}"
          body: |
            This PR updates documentation for version `${{ inputs.version }}`.
            
            ## Changes
            - Updated VERSION and DATE in Makefile
            - Ran the ruby script to extract module API docs
            - Updated the List of supported versions in the doc repo
            - Added new valkey.conf link

            This pull request is created automatically by the [Valkey-Release-Automation](https://github.com/valkey-io/valkey-release-automation)

      - name: Notify release owner
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          RELEASE_OWNER: ${{ inputs.release_owner }}
        run: gh pr comment "${{ steps.create-pr.outputs.pull-request-number }}" --repo "${{ github.repository_owner }}/valkey-doc" --body "@$RELEASE_OWNER, please review this automated release PR."
