name: Update Valkey Hashes
# Security boundary: this workflow pushes to the valkey-hashes repository (a
# production write). It is workflow_call ONLY and is reachable solely through
# build-release.yml, which gates every production event shape through the
# release-publish environment. Do NOT add a standalone workflow_dispatch trigger here
# without gating it behind the release-publish environment.

on:
  workflow_call:
    inputs:
      version:
        description: The version of Valkey to create.
        type: string
        required: true
      source_sha:
        description: Exact commit the release tag must resolve to.
        type: string
        required: true

jobs:
  commit-hash:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?|unstable)$ ]]; then
            echo "Invalid version format '$VERSION'. Expected format: x.y.z or 'unstable'."
            exit 1
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full lowercase commit SHA"; exit 1; }
          REF=$(gh api "repos/${{ github.repository_owner }}/valkey/git/ref/tags/${VERSION}")
          TYPE=$(jq -r '.object.type' <<< "$REF")
          SHA=$(jq -r '.object.sha' <<< "$REF")
          if [[ "$TYPE" == "tag" ]]; then
            TAG=$(gh api "repos/${{ github.repository_owner }}/valkey/git/tags/${SHA}")
            TYPE=$(jq -r '.object.type' <<< "$TAG")
            SHA=$(jq -r '.object.sha' <<< "$TAG")
          fi
          [[ "$TYPE" == "commit" && "$SHA" == "$SOURCE_SHA" ]] || {
            echo "Release tag $VERSION resolves to $TYPE $SHA, expected commit $SOURCE_SHA" >&2
            exit 1
          }

      - name: Generate token
        id: generate-token
        if: github.repository_owner == 'valkey-io'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-hashes
          # Security: without explicit permission-* inputs the minted token
          # inherits the App's FULL installation grant. This workflow only
          # clones valkey-hashes and pushes a commit to its default branch:
          # contents write covers the git fetch/push, and metadata read
          # covers the repository lookup actions/checkout performs to
          # resolve the default branch. Nothing else is granted.
          permission-contents: write
          permission-metadata: read

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey-hashes
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}

      - name: Ensure repository is initialized
        run: |
          if [ ! -d ".git" ]; then
            echo "Error: Not a git repository."
            exit 1
          fi
          if [ ! -f README ]; then
            echo "README file not found. Creating a new README file."
            touch README
          fi

      - name: Update hash
        run: |
          set -euo pipefail
          REF=$(gh api "repos/${{ github.repository_owner }}/valkey/git/ref/tags/${VERSION}")
          TYPE=$(jq -r '.object.type' <<< "$REF")
          SHA=$(jq -r '.object.sha' <<< "$REF")
          if [[ "$TYPE" == "tag" ]]; then
            TAG=$(gh api "repos/${{ github.repository_owner }}/valkey/git/tags/${SHA}")
            TYPE=$(jq -r '.object.type' <<< "$TAG")
            SHA=$(jq -r '.object.sha' <<< "$TAG")
          fi
          [[ "$TYPE" == "commit" && "$SHA" == "$SOURCE_SHA" ]] || {
            echo "Release tag moved before hash download: found $TYPE $SHA, expected $SOURCE_SHA" >&2
            exit 1
          }
          URL="https://github.com/valkey-io/valkey/archive/refs/tags/${VERSION}.tar.gz"
          FILENAME="valkey-${VERSION}.tar.gz"
          
          wget -O "$FILENAME" "$URL" || { echo "Failed to download $URL"; exit 1; }
          
          HASH=$(sha256sum "$FILENAME" | cut -d ' ' -f 1)
          
          if ! grep -q "$HASH $URL" README; then
            echo "hash $FILENAME sha256 $HASH $URL" >> README
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README
            git commit -s -m "Update hash for $VERSION"
            git push origin HEAD
          else
            echo "Hash entry already exists in README. Skipping append."
          fi
          
          rm "$FILENAME"
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
