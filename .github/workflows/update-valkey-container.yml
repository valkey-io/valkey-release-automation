name: Update Valkey Container

on:
  workflow_call:
    inputs:
      version:
        type: string
        description: "Valkey version that was released"
        required: true
      release_owner:
        type: string
        description: "GitHub login that approved the production release"
        required: true
    outputs:
      bashbrew_output:
        description: "Bashbrew output in JSON format"
        value: ${{ jobs.build-new-docker.outputs.bashbrew_json }}

jobs:
  build-new-docker:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the bashbrew action pin. The uses: line
      # below cannot read env, so it must carry the same SHA literally;
      # the scripts path is derived from THIS variable and the generate
      # step verifies the derived directory exists, so a uses: bump that
      # forgets this variable fails loudly instead of running stale
      # scripts.
      BASHBREW_REF: 9eef708e6a0b1b5d8bbda769c766777fe45026eb # v0.1.13
    outputs:
      bashbrew_json: ${{ steps.generate-bashbrew.outputs.bashbrew_content }}
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?|unstable)$ ]]; then
            echo "Invalid version format. Expected format: x.y.z or 'unstable'"
            exit 1
          fi

      - name: Generate token
        id: generate-token
        if: github.repository_owner == 'valkey-io'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-container
          # Security: without explicit permission-* inputs the minted token
          # inherits the App's FULL installation grant. This workflow checks
          # out valkey-container, commits, pushes a branch, and opens a PR
          # via peter-evans/create-pull-request: contents write covers the
          # git fetch/push, pull-requests write covers PR creation, and
          # metadata read covers the repository API lookups both actions
          # perform. Nothing else is granted.
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      
      - name: Set up bashbrew
        # This SHA must equal env.BASHBREW_REF above (uses: cannot read
        # env); the path-derivation check in the generate step catches a
        # mismatch at run time.
        uses: docker-library/bashbrew@9eef708e6a0b1b5d8bbda769c766777fe45026eb # v0.1.13
      
      - name: Check if bashbrew is installed
        run: |
          bashbrew --version

      - name: Checkout valkey-release-automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: valkey-release-automation
          persist-credentials: false

      - name: Checkout valkey-container
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey-container
          path: valkey-container
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.x'
      
      - name: Strip patch version
        id: strip_version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == "unstable" ]]; then
            echo "Version is unstable"
            echo "stripped_version=unstable" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+)\.[0-9]+(-rc[0-9]+)?$ ]]; then
            stripped_version="${BASH_REMATCH[1]}"
            echo "Stripped version: $stripped_version"
            echo "stripped_version=$stripped_version" >> $GITHUB_OUTPUT
          else
            echo "Version doesn't match expected format"
            exit 1
          fi
        shell: bash
      
      - name: Update new version
        id: version-update
        env:
          VERSION: ${{ inputs.version }}
          STRIPPED_VERSION: ${{ steps.strip_version.outputs.stripped_version }}
        run: |
            cd valkey-container
            jqt='.jq-template.awk'
            wget -qO "$jqt" 'https://github.com/docker-library/bashbrew/raw/9f6a35772ac863a0241f147c820354e4008edf38/scripts/jq-template.awk'
            jqf='.template-helper-functions.jq'
            wget -qO "$jqf" 'https://github.com/docker-library/bashbrew/raw/08c926140ad0af22de58c2a2656afda58082ba3e/scripts/template-helper-functions.jq'

            ./update.sh "$STRIPPED_VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            
            if ! git diff --cached --quiet; then
              git commit -m "Update versions.json and Dockerfiles for version $VERSION" -s
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "No changes to commit for version update - PR will not be created."
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi

      - name: Update container aliases
        id: alias-update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd valkey-container
          python ../valkey-release-automation/scripts/automate_alias_update.py \
            generate-stackbrew-library.sh \
            "$VERSION"
          
          git add generate-stackbrew-library.sh
          
          if ! git diff --cached --quiet; then
            git commit -m "Update container aliases for version $VERSION" -s
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit for aliases - PR will not be created."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate bashbrew output
        id: generate-bashbrew
        run: |
          cd valkey-container
          # The action directory on the runner is named after the pinned
          # ref; derive it from the shared BASHBREW_REF env var instead of
          # hardcoding the SHA a second time. If the uses: pin was bumped
          # without BASHBREW_REF this directory does not exist and we fail
          # here rather than running a stale checkout's scripts.
          BASHBREW_SCRIPTS="/home/runner/work/_actions/docker-library/bashbrew/${BASHBREW_REF}/scripts"
          if [[ ! -d "$BASHBREW_SCRIPTS" ]]; then
            echo "::error::BASHBREW_REF ($BASHBREW_REF) does not match the checked-out bashbrew action; update env.BASHBREW_REF and the uses: pin together."
            exit 1
          fi
          "$BASHBREW_SCRIPTS/github-actions/generate.sh" > bashbrew_output.json
          echo "bashbrew_content=$(cat bashbrew_output.json)" >> $GITHUB_OUTPUT
          rm bashbrew_output.json

      - name: Create Pull Request
        if: |
          steps.version-update.outputs.has_changes == 'true' || 
          steps.alias-update.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          path: valkey-container
          branch: update-${{ inputs.version }}
          commit-message: "Preparing changes for version ${{ inputs.version }}"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          signoff: true
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          title: "Update to version ${{ inputs.version }}"
          body: |
            This pull request updates the repository to version `${{ inputs.version }}`.

            This pull request is created automatically by the [Valkey-Release-Automation](https://github.com/valkey-io/valkey-release-automation)

      - name: Notify release owner
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.repository_owner == 'valkey-io' && steps.generate-token.outputs.token || secrets.AUTOMATION_PAT }}
          RELEASE_OWNER: ${{ inputs.release_owner }}
        run: gh pr comment "${{ steps.create-pr.outputs.pull-request-number }}" --repo "${{ github.repository_owner }}/valkey-container" --body "@$RELEASE_OWNER, please review this automated release PR."
